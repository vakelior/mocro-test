<header class="mocro-header" id="top">

    <div class="container masthead-inner">
      <a href="index.html" class="brand" aria-label="مُوكْرُو — الصفحة الرئيسية">مُوكْرُو</a>
      <nav class="nav-desktop" aria-label="التنقل الرئيسي">
        <div class="nav-item has-sub">
          <button class="nav-link nav-trigger" aria-haspopup="true" aria-expanded="false">الأقسام <svg class="icon nav-caret" viewBox="0 0 24 24" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg></button>
          <div class="submenu" role="menu" id="nav-categories-desktop"></div>
        </div>
      </nav>
      <div class="masthead-actions">
        <button class="burger" data-burger aria-label="فتح القائمة" aria-expanded="false" aria-controls="mobile-menu"><span></span></button>

<main id="main">

</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/js/config.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/main.js?v=4"></script>
<script src="assets/js/search.js"></script>
<script src="assets/js/shared.js?v=1"></script>
<script>
/* SPA router for GitHub Pages: /article/:slug and /category/:slug */
(function () {
  'use strict';
  function route() {
    var path = window.location.pathname;
    var segs = path.split('/').filter(Boolean);
    var kind = null;
    var idx = -1;
    for (var i = 0; i < segs.length; i++) {
      if (segs[i] === 'article' || segs[i] === 'category') { kind = segs[i]; idx = i; break; }
    }
    if (!kind || idx < 0 || idx === segs.length - 1) {
      window.location.replace('index.html');
      return;
    }
    var slug = segs[idx + 1];
    if (!slug) { window.location.replace('index.html'); return; }
    var s = document.createElement('script');
    if (kind === 'article') {
      document.title = 'مُوكْرُو — مقال';
      s.src = 'assets/js/article.js?v=16';
    } else {
      document.title = 'مُوكْرُو — قسم';
      var ph = document.getElementById('page-head');
      var lw = document.getElementById('listing-wrap');
      if (ph) ph.style.display = '';
      if (lw) lw.style.display = '';
      if (ph && !ph.querySelector('h1')) {
        ph.innerHTML = '<h1 class="skeleton" style="height:2.2rem;width:40%"></h1><div class="page-desc skeleton" style="height:1rem;width:60%;margin-top:.75rem"></div>';
      }
      s.src = 'assets/js/category.js?v=5';
    }
    document.body.appendChild(s);
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', route);
  } else {
    route();
  }
})();
</script>
</body>
</html>
